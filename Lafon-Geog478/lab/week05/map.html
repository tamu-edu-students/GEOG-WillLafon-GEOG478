<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Will Lafon First Web Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    /* 1. Initialize map */
    var map = L.map('map');

    /* 2. Tile layer */
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    /* 3. Custom LeafIcon class */
    var LeafIcon = L.Icon.extend({
      options: {
        shadowUrl:    'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
        iconSize:     [38, 95],
        shadowSize:   [50, 64],
        iconAnchor:   [22, 94],
        shadowAnchor: [4,  62],
        popupAnchor:  [-3, -76]
      }
    });

    var greenIcon  = new LeafIcon({ iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-green.png'  });
    var orangeIcon = new LeafIcon({ iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-orange.png' });

    /* 4. Kyle Field circle */
    var kyleFieldCoords = [30.6084, -96.3402];

    L.circle(kyleFieldCoords, {
      color:       '#f03',
      fillColor:   '#f03',
      fillOpacity: 0.15,
      weight:      2.5,
      radius:      500
    })
    .addTo(map)
    .bindPopup('Kyle Field — Coords: 30.6084, -96.3402 · Radius: 500 m');

    /* 5. O&M Building — green leaf icon */
    L.marker([30.6179, -96.3386], { icon: greenIcon })
      .addTo(map)
      .bindPopup('O&M Building — Coords: 30.6179, -96.3386');

    /* 6. Academic Building — orange leaf icon */
    L.marker([30.6159, -96.3413], { icon: orangeIcon })
      .addTo(map)
      .bindPopup('Academic Building — Coords: 30.6159, -96.3413');

    /* 7. Click event — show coordinates */
    var clickPopup = L.popup();
    map.on('click', function (e) {
      clickPopup
        .setLatLng(e.latlng)
        .setContent('You clicked the map at ' + e.latlng.toString())
        .openOn(map);
    });

    /* 8. Geolocation — locate & set view */
    map.locate({ setView: true, maxZoom: 16 });

    map.on('locationfound', function (e) {
      var radius = Math.round(e.accuracy);
      L.marker(e.latlng)
        .addTo(map)
        .bindPopup('You are within ' + radius + ' metres from this point.')
        .openPopup();
      L.circle(e.latlng, e.accuracy).addTo(map);
    });

    map.on('locationerror', function (e) {
      map.setView(kyleFieldCoords, 15);
      alert(e.message);
    });
  </script>

</body>
</html>
