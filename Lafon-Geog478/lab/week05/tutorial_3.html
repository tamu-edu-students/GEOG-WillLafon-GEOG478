<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet – Markers With Custom Icons</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; }
    header {
      background: #2e7d32;
      color: white;
      padding: 14px 24px;
    }
    header h1 { font-size: 1.3rem; }
    header p  { font-size: 0.82rem; opacity: 0.85; margin-top: 3px; }
    #map {
      width: 100%;
      height: calc(100vh - 66px);
    }
  </style>
</head>
<body>

  <header>
    <h1>🍃 Leaflet – Markers With Custom Icons</h1>
    <p>Three leaf markers (green, red, orange) using a shared LeafIcon class</p>
  </header>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // 1. Initialize the map
    var map = L.map('map').setView([51.5, -0.09], 13);

    // 2. Add the OpenStreetMap tile layer
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 3. Extend L.Icon to create a reusable LeafIcon class
    //    (shadowUrl, sizes, and anchors are shared; only iconUrl changes per instance)
    var LeafIcon = L.Icon.extend({
      options: {
        shadowUrl:    'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
        iconSize:     [38, 95],   // width, height of the icon
        shadowSize:   [50, 64],   // width, height of the shadow
        iconAnchor:   [22, 94],   // tip of icon aligns with marker's lat/lng
        shadowAnchor: [4,  62],   // tip of the shadow
        popupAnchor:  [-3, -76]   // popup opens above the icon
      }
    });

    // 4. Create green, red, and orange leaf icons
    var greenIcon  = new LeafIcon({ iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-green.png'  });
    var redIcon    = new LeafIcon({ iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-red.png'    });
    var orangeIcon = new LeafIcon({ iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-orange.png' });

    // 5. Place markers with the custom icons
    L.marker([51.5,   -0.09 ], { icon: greenIcon  }).addTo(map).bindPopup('I am a green leaf.');
    L.marker([51.495, -0.083], { icon: redIcon    }).addTo(map).bindPopup('I am a red leaf.');
    L.marker([51.49,  -0.1  ], { icon: orangeIcon }).addTo(map).bindPopup('I am an orange leaf.');
  </script>

</body>
</html>
