<!DOCTYPE html>
<html lang="en">
<head>
    <title>Will Lafon TAMU Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* Info control styling */
        .info {
            padding: 8px 10px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .info h4 {
            margin: 0 0 5px;
            color: #500000;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    /* =============================
       1. Initialize the map
       ============================= */
    const map = L.map('map').setView(
        [30.6187, -96.3365], // TAMU Campus
        16                  // appropriate campus-level zoom
    );

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    /* =============================
       2. Info Control
       ============================= */
    const info = L.control();

    info.onAdd = function () {
        this._div = L.DomUtil.create('div', 'info');
        this.update();
        return this._div;
    };

    info.update = function (props) {
        this._div.innerHTML = '<h4>TAMU Building</h4>' +
            (props
                ? `<strong>${props.name}</strong><br/>
                   Abbr: ${props.abbr}`
                : 'Hover over a building');
    };

    info.addTo(map);

    /* =============================
       3. Style Functions
       ============================= */
    function style(feature) {
        return {
            fillColor: '#500000',   // TAMU Maroon
            weight: 1,
            opacity: 1,
            color: 'white',
            fillOpacity: 0.8
        };
    }

    function highlightFeature(e) {
        const layer = e.target;

        layer.setStyle({
            weight: 3,
            color: '#FFD700',   // gold highlight
            fillOpacity: 1
        });

        layer.bringToFront();
        info.update(layer.feature.properties);
    }

    function resetHighlight(e) {
        buildings.resetStyle(e.target);
        info.update();
    }

    function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: zoomToFeature
        });
    }

    /* =============================
       4. Load TAMU Buildings GeoJSON
       ============================= */

    /*
      This GeoJSON is hosted externally.
      It contains TAMU building footprints with:
        - properties.name
        - properties.abbr
    */

    const buildings = L.geoJSON(null, {
        style: style,
        onEachFeature: onEachFeature
    }).addTo(map);

    fetch('https://raw.githubusercontent.com/tamu-gisc/geojson-data/main/tamu_buildings.geojson')
        .then(response => response.json())
        .then(data => {
            buildings.addData(data);
        });

</script>

</body>
</html>
