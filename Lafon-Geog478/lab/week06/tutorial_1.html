<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Using GeoJSON with Leaflet</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; font-family: sans-serif; }
    h2 { padding: 0.5rem 1rem; background: #3a3a3a; color: #fff; margin: 0; }
    #map { height: calc(100vh - 44px); }
  </style>
</head>
<body>

<h2>Using GeoJSON with Leaflet</h2>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // ─── 1. Initialise the map ──────────────────────────────────────────────────
  const map = L.map('map').setView([39.74, -104.99], 5);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);


  // ─── 2. Simple GeoJSON Point with popup (onEachFeature) ────────────────────
  const geojsonFeature = {
    "type": "Feature",
    "properties": {
      "name": "Coors Field",
      "amenity": "Baseball Stadium",
      "popupContent": "This is where the Rockies play!"
    },
    "geometry": {
      "type": "Point",
      "coordinates": [-104.99404, 39.75621]   // [lon, lat] in GeoJSON
    }
  };

  function onEachFeature(feature, layer) {
    // Attach a popup if the feature has a popupContent property
    if (feature.properties && feature.properties.popupContent) {
      layer.bindPopup(feature.properties.popupContent);
    }
  }

  L.geoJSON(geojsonFeature, {
    onEachFeature: onEachFeature
  }).addTo(map);


  // ─── 3. LineStrings with a uniform style ───────────────────────────────────
  const myLines = [
    {
      "type": "LineString",
      "coordinates": [[-100, 40], [-105, 45], [-110, 55]]
    },
    {
      "type": "LineString",
      "coordinates": [[-105, 40], [-110, 45], [-115, 55]]
    }
  ];

  const myStyle = {
    "color": "#ff7800",
    "weight": 5,
    "opacity": 0.65
  };

  L.geoJSON(myLines, { style: myStyle }).addTo(map);


  // ─── 4. Polygons styled by property (Republican / Democrat) ────────────────
  const states = [
    {
      "type": "Feature",
      "properties": { "party": "Republican" },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-104.05, 48.99],
          [-97.22,  48.98],
          [-96.58,  45.94],
          [-104.03, 45.94],
          [-104.05, 48.99]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": { "party": "Democrat" },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-109.05, 41.00],
          [-102.06, 40.99],
          [-102.03, 36.99],
          [-109.04, 36.99],
          [-109.05, 41.00]
        ]]
      }
    }
  ];

  L.geoJSON(states, {
    style: function (feature) {
      switch (feature.properties.party) {
        case 'Republican': return { color: "#ff0000" };
        case 'Democrat':   return { color: "#0000ff" };
      }
    }
  }).addTo(map);


  // ─── 5. Points rendered as CircleMarkers (pointToLayer) ────────────────────
  const someGeojsonFeature = {
    "type": "Feature",
    "properties": {
      "name": "Coors Field (circle)",
      "popupContent": "Rendered as a CircleMarker!"
    },
    "geometry": {
      "type": "Point",
      "coordinates": [-104.97404, 39.73621]
    }
  };

  const geojsonMarkerOptions = {
    radius: 8,
    fillColor: "#ff7800",
    color: "#000",
    weight: 1,
    opacity: 1,
    fillOpacity: 0.8
  };

  L.geoJSON(someGeojsonFeature, {
    pointToLayer: function (feature, latlng) {
      return L.circleMarker(latlng, geojsonMarkerOptions);
    },
    onEachFeature: onEachFeature
  }).addTo(map);


  // ─── 6. Filter: only show features where show_on_map === true ──────────────
  const someFeatures = [
    {
      "type": "Feature",
      "properties": {
        "name": "Coors Field",
        "show_on_map": true,
        "popupContent": "Coors Field — visible (filter: true)"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [-104.99404, 39.72621]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "Busch Field",
        "show_on_map": false,
        "popupContent": "Busch Field — you should NOT see this marker"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [-104.98404, 39.71621]
      }
    }
  ];

  L.geoJSON(someFeatures, {
    filter: function (feature) {
      return feature.properties.show_on_map;   // Busch Field is hidden
    },
    onEachFeature: onEachFeature
  }).addTo(map);
</script>

</body>
</html>
