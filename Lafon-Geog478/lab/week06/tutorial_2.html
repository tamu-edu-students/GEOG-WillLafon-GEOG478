  <!-- ✅ Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 n: 0;

    #map {
      height: 100%;

</head>

<body>
<div id="map"></div>

<!-- ✅ Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.t.js

<!-- ✅ US states GeoJSON -->
<script src="https://leafletjs.com/examples/choropleth/us-states.jscript>
  console.log("Leaflet loaded:", typeof L);
  console.log("States data loaded:", typeof statesData);

  const map = L.map('map').setView([37.8, -96], 4);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function getColor(d) {
    return d > 1000 ? '#800026' :
           d > 500  ? '#BD0026' :
           d > 200  ? '#E31A1C' :
           d > 100  ? '#FC4E2A' :
           d > 50   ? '#FD8D3C' :
           d > 20   ? '#FEB24C' :
           d > 10   ? '#FED976' :
                      '#FFEDA0';
  }

  function style(feature) {
    return {
      fillColor: getColor(feature.properties.density),
      weight: 2,
      color: 'white',
      fillOpacity: 0.7
    };
  }

  L.geoJson(statesData, { style }).addTo(map);
</script>

</body>
</html>
